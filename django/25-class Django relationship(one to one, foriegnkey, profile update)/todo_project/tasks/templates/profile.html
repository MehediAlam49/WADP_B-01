{% extends 'master/base.html' %}


{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg border-0 rounded-4">

                <!-- Header -->
                <div class="card-header bg-primary text-white text-center rounded-top-4 py-4">
                    <h3 class="mb-0">
                        My Profile
                    </h3>
                </div>


                <div class="card-body text-center p-5">


                    <!-- Profile Image -->
                    <img 
                    src="{{request.user.user_profile.profile_img.url}}" 
                    class="rounded-circle shadow mb-4"
                    width="150"
                    height="150"
                    style="object-fit: cover;"
                    alt="Profile Image">


                    <!-- Name -->
                    <h3 class="fw-bold">
                        {{request.user.full_name}}
                    </h3>

                    <p class="text-muted">
                        @{{request.user.username}}
                    </p>


                    <hr>


                    <!-- Profile Details -->
                    <div class="text-start">


                        <div class="mb-3">

                            <h6 class="text-primary">
                                <i class="bi bi-person-fill"></i>
                                Full Name
                            </h6>

                            <p class="ms-4">
                                {{request.user.full_name}}
                            </p>

                        </div>



                        <div class="mb-3">

                            <h6 class="text-primary">
                                <i class="bi bi-geo-alt-fill"></i>
                                Address
                            </h6>

                            <p class="ms-4">
                                {{request.user.user_profile.address}}
                            </p>

                        </div>




                        <div class="mb-3">

                            <h6 class="text-primary">
                                <i class="bi bi-telephone-fill"></i>
                                Phone
                            </h6>

                            <p class="ms-4">
                                {{request.user.user_profile.phone}}
                            </p>

                        </div>


                    </div>



                    <!-- Button -->

                    <a 
                    href="{% url 'update_profile' %}" 
                    class="btn btn-primary px-5 rounded-pill">

                        <i class="bi bi-pencil-square"></i>
                        Update Profile

                    </a>



                </div>


            </div>


        </div>

    </div>

</div>


{% endblock content %}
